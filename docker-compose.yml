services:
  app: &base
    build: .
    command: composer ci
    environment: &base_env
      DB_USER: root
      DB_PASSWORD: somePassword
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: testdb
    volumes:
      - ssh-keys:/root/.ssh:ro
    depends_on:
      - mariadb
      - toxiproxy
      - sshproxy

  dev:
    <<: *base
    # dev bind-mounts the source and composer.lock is gitignored, so `composer install` here resolves
    # from scratch and hits Composer 2.9+ security blocking on guzzle 6 (a dev-only toxiproxy transitive;
    # see Dockerfile). The opt-out is scoped to this dev service only - the app/CI runtime keeps blocking.
    environment:
      <<: *base_env
      COMPOSER_NO_SECURITY_BLOCKING: "1"
    volumes:
      - .:/code
      - ssh-keys:/root/.ssh:ro

  wait:
    image: waisbrot/wait
    depends_on:
      - mariadb
      - sshproxy
    environment:
      - TARGETS=mariadb:3306,sshproxy:22
      - TIMEOUT=60

  toxiproxy:
    image: shopify/toxiproxy
    depends_on:
      - mariadb

  sshproxy:
    image: keboola/db-component-ssh-proxy:latest
    volumes:
      - ssh-keys:/root/.ssh
    links:
      - mariadb

  mariadb:
    image: mariadb:10
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_PASSWORD: somePassword

volumes:
  ssh-keys:
